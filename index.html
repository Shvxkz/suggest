<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>my edits >.<</title>
    <link rel="icon" type="image/png" href="favicon.png">

    <style>
        :root {
            --glow-color: #574F64;
            --hover-glow-color: #ffffff;
            --glow-size: 25px;
            --video-radius: 12px;
            --card-background: #000000;
            --gap: 67px;
            --blur: 8px;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            min-height: 100%;
        }

        body {
            padding: 40px;
            background: #000;
            font-family: Consolas, "Courier New", monospace;
            position: relative;
        }

        .background-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -2;
            pointer-events: none;
        }

        body::after {
            content: "";
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.35);
            z-index: -1;
            pointer-events: none;
        }

        .video-grid {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: var(--gap);
            visibility: hidden;
            opacity: 0;
        }

        body.entered .video-grid {
            visibility: visible;
            opacity: 1;
        }

        .video-card {
            position: relative;
            background: var(--card-background);
            border-radius: var(--video-radius);
            overflow: hidden;
            box-shadow: 0 0 var(--glow-size) var(--glow-color);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .video-card video {
            display: block;
            width: 100%;
            height: auto;
            aspect-ratio: 16 / 9;
            object-fit: cover;
            background: #000;
            border-radius: var(--video-radius);
            filter: blur(var(--blur));
            transform: scale(1.03);
            transition: filter 0.3s ease, transform 0.3s ease;
        }

        .video-card:hover {
            transform: translateY(-4px);
            box-shadow:
                0 0 15px var(--hover-glow-color),
                0 0 35px var(--hover-glow-color),
                0 0 60px var(--hover-glow-color);
        }

        .video-card:hover video {
            filter: blur(0);
            transform: scale(1);
        }

        video:fullscreen {
            filter: none !important;
            transform: none !important;
            border-radius: 0 !important;
        }

        video:-webkit-full-screen {
            filter: none !important;
            transform: none !important;
            border-radius: 0 !important;
        }

        .enter-screen {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            background: rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            transition: opacity 0.3s ease;
        }

        .enter-screen.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .enter-text {
            color: #fff;
            font-size: 14px;
            font-weight: 500;
            letter-spacing: 2px;
            text-shadow:
                0 0 10px rgba(255, 255, 255, 0.5),
                0 0 25px rgba(255, 255, 255, 0.25);
            transition:
                transform 0.3s ease,
                opacity 0.3s ease;
        }

        .enter-screen:hover .enter-text {
            transform: scale(1.05);
        }

        @media (max-width: 900px) {
            .video-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 600px) {
            body {
                padding: 15px;
            }

            .video-grid {
                grid-template-columns: 1fr;
                gap: 40px;
                width: 100%;
            }

            .video-card {
                width: 100%;
            }

            .video-card video {
                width: 100%;
            }

            .enter-text {
                font-size: 12px;
            }
        }
    </style>
</head>

<body>

    <video class="background-video" autoplay muted loop playsinline>
        <source src="bg.mp4" type="video/mp4">
    </video>

    <div class="video-grid">

        <div class="video-card">
            <video controls loop muted playsinline data-src="1.mp4"></video>
        </div>

        <div class="video-card">
            <video controls loop muted playsinline data-src="2.mp4"></video>
        </div>

        <div class="video-card">
            <video controls loop muted playsinline data-src="3.mp4"></video>
        </div>

        <div class="video-card">
            <video controls loop muted playsinline data-src="4.mp4"></video>
        </div>

        <div class="video-card">
            <video controls loop muted playsinline data-src="5.mp4"></video>
        </div>

        <div class="video-card">
            <video controls loop muted playsinline data-src="6.mp4"></video>
        </div>

        <div class="video-card">
            <video controls loop muted playsinline data-src="7.mp4"></video>
        </div>

        <div class="video-card">
            <video controls loop muted playsinline data-src="8.mp4"></video>
        </div>

    </div>

    <div class="enter-screen" id="enterScreen">
        <div class="enter-text">click :3</div>
    </div>

    <script>
        const enterScreen = document.getElementById("enterScreen");
        enterScreen.addEventListener("click", () => {
            document.querySelectorAll(".video-card video").forEach(video => {
                const source = document.createElement("source");
                source.src = video.dataset.src;
                source.type = "video/mp4";
                video.appendChild(source);
                video.load();
            });
            document.body.classList.add("entered");
            enterScreen.style.opacity = "0";
            setTimeout(() => {
                enterScreen.style.display = "none";
            }, 300);
        });
    </script>

</body>
</html>
